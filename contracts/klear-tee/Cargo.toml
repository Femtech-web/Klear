[package]
name = "klear-tee"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Klear's TEE registry on NEAR: a NEAR AI Cloud model's TDX quote verified by NEAR's DCAP verifier, and sealed decisions' signatures checked on chain"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
