[package]
name = "near-keel"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keel judge on NEAR: Read MPC-attested evidence in, MPC-signed bounded orders out, one payout per verified repair"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"
keel-core = { path = "../../crates/keel-core" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Built on its own (cargo-near), not as a member of the off-chain workspace.
[workspace]
