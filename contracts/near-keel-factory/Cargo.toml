[package]
name = "near-keel-factory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Keel's factory on NEAR: creates a strategy's judge, locked from birth, and keeps the public registry of strategies"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.17"
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.17", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Built on its own (cargo-near), after contracts/near-keel: it embeds the judge's wasm.
[workspace]
