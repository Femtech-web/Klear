name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the version in a comment).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks) and never-public paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks v8.30.1 (checksum-verified release binary)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="HEAD" -v .
      - name: keys, .env files and the testnet stand-ins' secrets are never tracked
        # The same paths as .githooks/pre-commit: the hook is opt-in, this is enforced.
        run: |
          if git ls-files | grep -E '^(\.secrets/|(.*/)?\.env$|(.*/)?\.env\.)' | grep -Ev '(^|/)\.env\.example$'; then
            echo "never-public path is tracked"; exit 1
          fi

  rust:
    name: rules, engine and replay (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  near-contract:
    name: the NEAR judge and factory (unit tests, wasm builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/near-keel
      - run: npm ci
      - run: cargo test --locked
        working-directory: contracts/near-keel
      - name: wasm build with the repository's pinned cargo-near (the deployed judges' hash is in docs/results/g7/code-hashes.txt)
        run: make judge
      - name: the factory (it embeds the judge just built) and its tests
        run: make factory-test factory

  evm:
    name: KeelLeg, KeelVault and the end-to-end loop through the judge (Foundry, simulated HyperCore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p keel-core
      - run: forge test
        working-directory: contracts/evm
      - name: end to end through the real Rust judge (ffi, one thread)
        run: KEEL_E2E=1 forge test --ffi --threads 1 --match-path 'test/e2e/*'
        working-directory: contracts/evm

  replay:
    name: the Alpha Arena replay reproduces its published numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo run --locked -q -p keel-replay --release
      - name: docs/results/replay is exactly what the cached data and keel_core::rules produce
        run: git diff --exit-code -- docs/results/replay

  web:
    name: site (data drift, lint, types, unit, build, every page light/dark/mobile, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: web/data is exactly what docs/results produce
        run: npm run sync-data && git diff --exit-code -- data
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: every page in light, dark and mobile (reads the live testnet judges)
        run: npx playwright test
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high
