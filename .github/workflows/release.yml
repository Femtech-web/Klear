name: release

# On a version tag: the judge's wasm, the EVM contracts' ABIs and bytecode, the keel-judge CLI and the
# replay for Linux and macOS, one SHA256SUMS over everything, build provenance, and a GitHub release whose
# notes are the tag's section of CHANGELOG.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: keel-judge and keel-replay (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release -p keel-core --bin keel-judge -p keel-replay
      - name: package
        run: |
          mkdir -p dist
          tar -czf "dist/keel-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C target/release keel-judge keel-replay
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  contracts:
    name: judge wasm and EVM artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/near-keel
      - run: npm ci
      - run: make judge
      - run: forge build
        working-directory: contracts/evm
      - name: collect
        run: |
          mkdir -p dist/evm
          cp contracts/near-keel/target/near/near_keel.wasm "dist/near_keel-${{ github.ref_name }}.wasm"
          for c in KeelLeg KeelVault BalanceProbe; do cp "contracts/evm/out/$c.sol/$c.json" "dist/evm/$c.json"; done
          tar -czf "dist/keel-evm-${{ github.ref_name }}.tar.gz" -C dist evm && rm -r dist/evm
          cp docs/results/replay/summary.json "dist/alpha-arena-replay-${{ github.ref_name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: dist/*

  publish:
    name: release
    needs: [binaries, contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums and release notes
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          awk -v tag="${GITHUB_REF_NAME}" '$0 ~ "^## " tag {on=1; next} /^## /{on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: notes.md
          files: dist/*
